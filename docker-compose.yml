services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: contract
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: marriage_contract
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U contract -d marriage_contract']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      PUBLIC_ORIGIN: ${DEPLOY_ORIGIN:-http://localhost}
      DATABASE_URL: postgres://contract:${POSTGRES_PASSWORD}@postgres:5432/marriage_contract
      STORAGE_DIR: /data/storage
      SESSION_SECRET: ${SESSION_SECRET}
      TOKEN_PEPPER: ${TOKEN_PEPPER}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      MAX_SIGNATURE_BYTES: ${MAX_SIGNATURE_BYTES:-2097152}
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    volumes:
      - ./storage:/data/storage
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health/live']
      interval: 10s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  pgdata:
  caddy_data:
